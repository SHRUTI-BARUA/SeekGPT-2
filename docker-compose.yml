services:
  ai-service:
    image: ${DOCKERHUB_USERNAME:-seekgpt}/seekgpt-ai-service:latest
    build: ./ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service/chroma_db:/app/chroma_db

  backend:
    image: ${DOCKERHUB_USERNAME:-seekgpt}/seekgpt-backend:latest
    build: ./Backend
    ports:
      - "8080:8080"
    env_file:
      - ./Backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      - ai-service

  frontend:
    image: ${DOCKERHUB_USERNAME:-seekgpt}/seekgpt-frontend:latest
    build: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
